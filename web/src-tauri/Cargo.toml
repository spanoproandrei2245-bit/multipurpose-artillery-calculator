[package]
name = "artillery-calculator"
version = "0.16.1"
description = "Firing calculator for Arma 3 ACE3 mortars and artillery"
authors = ["Heis"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
# Нужен коду, который generate_context! создаёт из настроек плагинов (plugins.updater)
serde_json = "1"

# Сырое движение мыши для наводки (src/mouse.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
