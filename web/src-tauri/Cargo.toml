[package]
name = "artillery-calculator"
version = "0.14.0"
description = "Firing calculator for Arma 3 ACE3 mortars and artillery"
authors = ["Heis"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
