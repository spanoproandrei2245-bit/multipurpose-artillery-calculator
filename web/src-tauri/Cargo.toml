[package]
name = "artillery-calculator"
version = "0.16.0"
description = "Firing calculator for Arma 3 ACE3 mortars and artillery"
authors = ["Heis"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Нужен коду, который generate_context! создаёт из настроек плагинов (plugins.updater)
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
