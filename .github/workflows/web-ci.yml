
name: Web CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    # Имя совпадает с обязательной проверкой в защите ветки main — не переименовывать
    name: Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Checkout maps (branch maps)
        uses: actions/checkout@v7
        with:
          ref: maps
          path: maps-branch

      - name: Put maps into public/maps
        run: |
          mkdir -p public/maps
          cp -r ../maps-branch/. public/maps/
          rm -rf public/maps/.git
          test -f public/maps/index.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check ballistic tables against sources
        run: npm run tables:check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Smoke tests of the built site
        run: npm run test:e2e

      - name: Upload smoke test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
