
name: Web CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check ballistic tables against sources
        run: npm run tables:check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
