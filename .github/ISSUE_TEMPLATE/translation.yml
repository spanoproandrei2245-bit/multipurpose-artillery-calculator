name: Перевод / Translation
description: Неточный или странный перевод интерфейса / An inaccurate or odd translation
labels: [translation]
body:
  - type: dropdown
    id: language
    attributes:
      label: Язык / Language
      options: [Русский, English, Українська, Deutsch, Français, 日本語, 中文]
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Где и что не так / Where and what is wrong
      description: Текст сейчас и как правильно / Current text and the correct one
    validations:
      required: true
